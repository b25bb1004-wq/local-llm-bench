# llama-server router presets: one server, models load on demand (one at a time).
# Paths are relative to where you start the server; point `models/` at your GGUF folder.
version = 1

[*]
ngl = 99          # all layers on the GPU unless a model says otherwise
fa = on           # flash attention
ctk = q8_0        # quantised KV cache
ctv = q8_0
c = 8192
jinja = true

# Mixture-of-experts models: keep the expert tensors of the first 20 layers on the CPU (about 3B parameters are active per token)
[qwen3-coder]
model = models/Qwen3-Coder-30B-A3B-Instruct-IQ4_XS.gguf
n-cpu-moe = 20

[qwen35-35b]
model = models/Qwen3.5-35B-A3B-UD-IQ4_XS.gguf
n-cpu-moe = 20

[llama31-8b]
model = models/Llama-3.1-8B-Instruct-Q4_K_M.gguf

# Dense models do not fit: offload part of the layers and shrink the context
[llama33-70b]
model = models/Llama-3.3-70B-Instruct-IQ2_XXS.gguf
ngl = 36
c = 4096

[qwen25-32b]
model = models/Qwen2.5-32B-Instruct-IQ4_XS.gguf
ngl = 34
c = 4096
